name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 显示工具链
        run: |
          sw_vers
          swift --version
          xcodebuild -version || true

      - name: 编译 .app
        run: ./build.sh

      - name: 校验产物
        run: |
          plutil -lint build/PeripheralBattery.app/Contents/Info.plist
          codesign -dv build/PeripheralBattery.app
          ls -la build/PeripheralBattery.app/Contents/MacOS

      - name: 打包 zip
        run: ditto -c -k --sequesterRsrc --keepParent build/PeripheralBattery.app PeripheralBattery.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PeripheralBattery-app
          path: PeripheralBattery.zip
          if-no-files-found: error
